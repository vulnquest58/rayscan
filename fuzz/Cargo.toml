[package]
name = "rayscan-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rayscan]
path = ".."

[[bin]]
name = "service_inspect"
path = "fuzz_targets/service_inspect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "udp_inspect"
path = "fuzz_targets/udp_inspect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "packet_parse"
path = "fuzz_targets/packet_parse.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
